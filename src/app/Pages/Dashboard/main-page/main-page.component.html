<h1>Control de pagos</h1>
<ngx-charts-bar-horizontal
  [results]="data"
  [xAxis]="true"
  [yAxis]="true"
  [legend]="true"
  [view]="[700, 200]"
  [showXAxisLabel]="true"
  [showYAxisLabel]="true"
  [xAxisLabel]="'Deuda'"
  [xAxisTickFormatting]="formatCurrency"
  [yAxisLabel]="'Deudores'"
></ngx-charts-bar-horizontal>

<div class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Filtro selector -->
    <div class="flex items-center justify-end gap-2">
      <label for="mesFiltro" class="text-sm text-gray-600">Filtrar por mes:</label>
      <select
        id="mesFiltro"
        class="border rounded-md px-3 py-2 text-sm"
      >
        <option value="">Todos</option>
        <option *ngFor="let item of data" [value]="item.name">{{ item.name }}</option>
      </select>
    </div>
  
    <!-- Tabla -->
    <div class="overflow-x-auto border border-gray-200 rounded-xl shadow-lg">
      <table class="w-full table-auto text-sm text-left bg-white rounded-xl">
        <thead class="bg-blue-600 text-white uppercase text-xs">
          <tr>
            <th class="px-6 py-3">Mes</th>
            <th class="px-6 py-3">Monto</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let item of dataFiltrada()"
            class="border-t hover:bg-blue-50 transition duration-200"
          >
            <td class="px-6 py-3 font-medium text-gray-800">{{ item.name }}</td>
            <td class="px-6 py-3 text-green-700">{{ formatCurrency(item.value) }}</td>
          </tr>
          <tr *ngIf="dataFiltrada().length === 0">
            <td colspan="2" class="text-center py-4 text-gray-500">No hay datos para mostrar</td>
          </tr>
        </tbody>
      </table>
    </div>
  
  </div>
